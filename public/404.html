<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0D0E12" />
    <title>Página no encontrada | StreetBoss</title>
    <meta name="description" content="La página que buscas no está disponible. Regresa al sitio oficial de StreetBoss." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://streetboss.com.mx/" />
    <link rel="icon" type="image/png" href="/brand/SB_FAVICON_512x512_V01.png" />
    <link rel="apple-touch-icon" href="/brand/SB_APPLE_TOUCH_ICON_180x180_V01.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
      body { font-family: 'Inter', sans-serif; background-color: #0D0E12; color: #FFFFFF; }
    </style>
  </head>
  <body class="relative min-h-screen w-full bg-[#0D0E12] text-white flex flex-col justify-between overflow-x-hidden selection:bg-[#FF4B00] selection:text-white">
    <!-- Capa gastronómica moody de fondo -->
    <div className="absolute inset-0 z-0 opacity-25 mix-blend-luminosity pointer-events-none" style="position: absolute; inset: 0; opacity: 0.25; mix-blend-mode: luminosity;">
      <img
        src="/productos/bbq_chicken_wings.webp"
        alt="Gastronomía StreetBoss"
        style="width: 100%; height: 100%; object-fit: cover; filter: blur(2px); transform: scale(1.05);"
      />
      <div style="position: absolute; inset: 0; background: linear-gradient(to top, #0D0E12, rgba(13,14,18,0.8), rgba(13,14,18,0.9));"></div>
    </div>

    <!-- Resplandor cálido de marca -->
    <div style="position: absolute; left: 50%; top: 35%; width: 400px; height: 400px; transform: translate(-50%, -50%); border-radius: 9999px; background: rgba(255, 75, 0, 0.2); filter: blur(130px); pointer-events: none;"></div>

    <!-- Header con Logo Oficial -->
    <header class="relative z-10 w-full px-6 py-6 sm:py-8 flex justify-center">
      <a href="/" class="inline-block transition-transform hover:scale-105">
        <img
          src="/brand/StreetBoss_Logo_Horizontal_Oficial.webp"
          alt="StreetBoss"
          width="600"
          height="337"
          class="h-12 sm:h-16 w-auto object-contain mix-blend-screen"
        />
      </a>
    </header>

    <!-- Contenido Principal 404 -->
    <main class="relative z-10 my-auto px-4 py-8 text-center max-w-xl mx-auto flex flex-col items-center">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full border border-[#FF4B00]/30 bg-[#FF4B00]/10 text-[#FF6A1A] text-xs font-black uppercase tracking-[0.25em] mb-4">
        Error 404
      </div>

      <!-- 404 Gigante -->
      <h1 class="text-8xl sm:text-9xl font-black tracking-tighter leading-none bg-gradient-to-b from-[#FF6A1A] via-[#FF4B00] to-[#E03E00] text-transparent bg-clip-text drop-shadow-[0_10px_30px_rgba(255,75,0,0.35)] select-none">
        404
      </h1>

      <!-- Subtítulo y Copy Oficial -->
      <h2 class="mt-3 text-2xl sm:text-4xl font-black tracking-tight text-white">
        Esta ruta no está en el menú.
      </h2>

      <p class="mt-4 text-sm sm:text-base leading-relaxed text-gray-300 max-w-md">
        La página que buscas ya no existe o cambió de dirección.
      </p>

      <!-- Botón CTA Naranja -->
      <div class="mt-8 w-full sm:w-auto">
        <a
          href="/"
          class="inline-flex w-full sm:w-auto items-center justify-center gap-3 rounded-full bg-[#FF4B00] hover:bg-[#FF6A1A] px-9 py-4 text-base font-black text-white shadow-[0_0_35px_rgba(255,75,0,0.45)] transition-all duration-300 hover:scale-105 active:scale-95"
        >
          ← VOLVER AL INICIO
        </a>
      </div>

      <!-- Mensaje Secundario Oficial -->
      <p class="mt-8 text-xs font-bold uppercase tracking-[0.3em] text-gray-500">
        Vende directo. Manda tú.
      </p>
    </main>

    <!-- Footer Mínimo -->
    <footer class="relative z-10 w-full px-6 py-6 text-center text-xs text-gray-600 border-t border-white/5 bg-[#0D0E12]/80 backdrop-blur">
      <p>© 2026 StreetBoss. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
